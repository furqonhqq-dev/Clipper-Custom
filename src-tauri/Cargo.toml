[package]
name = "openclipper-custom"
version = "0.1.0"
description = "Fondasi aplikasi video lokal OpenClipper Custom"
authors = ["OpenClipper Custom contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
sysinfo = "0.33"
