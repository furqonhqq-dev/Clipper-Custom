name: PoC M0-C3C2 beginner UX and two-video Preview Lab
on:
  push:
    branches:
      - poc/v0.2.0-engine-comparison
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "tests/**"
      - "poc/checkpoint3c/**"
      - ".github/workflows/poc-checkpoint3c.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-lab-windows:
    name: Windows x64 WebView2 preview lab and NSIS installer
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install locked frontend dependencies
        run: npm ci
      - name: Verify JavaScript and unit tests
        run: npm run check
      - name: Install browser test runner
        run: npx playwright install chromium
      - name: Verify original v0.1 browser workflow
        run: npm run test:browser
      - name: Verify C3C2 base-only regression and two-video UX
        run: node tests/browser-c3c.mjs
      - name: Format temporary Rust working copy and compile locked Tauri backend
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Build isolated experimental Windows installer
        run: npm run tauri build -- --bundles nsis --ci -- --locked

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: OpenClipper-C3C2-Experimental-Windows-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
